# Degree Apprenticeship Tracker configuration.
# Edit this file to change interests/scoring without touching Python code.

location:
  primary: London
  allow_greater_london: true
  # substrings (lowercased) that count as "London-based" for the location hard-check
  london_terms:
    - london
    - greater london
    - city of london
    - "e1"
    - canary wharf

entry_year:
  primary: 2027
  also_capture: [2028]

level:
  minimum: 6

subjects:
  # Search terms sent to findapprenticeship.service.gov.uk's "What" box
  # (app/sources/findapprenticeship.py). That site matches search terms as an
  # exact phrase, not a topic/semantic search - multi-word phrases like
  # "computer science" or "software engineering" return 0 results even
  # though relevant listings exist (confirmed live: "computer science" = 0,
  # "software engineer" = 0, but "software" = 22, "engineering" = 109).
  # Keep this list short, broad, single words - real subject/relevance
  # filtering happens afterwards in app/scoring.py, not here.
  - software
  - data
  - cyber
  - computer
  - digital
  - engineering
  - technology
  - security

interests:
  sport: [sport, sports, rowing, football, formula 1, f1, olympic, performance analysis, performance analytics, sports analytics, sports technology, sports science]
  crime: [crime, cyber crime, forensic, forensics, criminal investigation, intelligence, national security, police]
  travel: [travel, aviation, airline, airport, transport, rail, logistics, route optimisation, route optimization]
  government: [government, gchq, ncsc, home office, ministry of defence, ministry of justice, national crime agency, metropolitan police, cabinet office, government digital service]

employers_seed:
  # used by sources/employers.py as a starting list of employer career pages to check
  # (JSON-LD JobPosting scraper - add more URLs here as you find them)
  - name: "BT"
    careers_url: "https://www.bt.com/careers/early-careers/apprenticeships"
  - name: "Transport for London"
    careers_url: "https://tfl.gov.uk/corporate/careers/early-careers/apprenticeships"

minimum_score_for_emergency: 75

email:
  weekly_day: Monday

rate_limit:
  delay_seconds: 2.0
  timeout_seconds: 20
