name: Daily apprenticeship scan

on:
  schedule:
    - cron: "0 7 * * *"   # 07:00 UTC every day
  workflow_dispatch: {}    # allow manual "Run workflow" from the Actions tab

# Needed so the job can commit the updated tracker.db back to the repo
# (SQLite + repo persistence: the simplest reliable option for a first
# version - see README "Known limitations" for the Postgres/Supabase upgrade path).
permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run daily tracker
        env:
          TRACKER_DB_PATH: ${{ github.workspace }}/tracker.db
          EMAIL_HOST: ${{ secrets.EMAIL_HOST }}
          EMAIL_PORT: ${{ secrets.EMAIL_PORT }}
          EMAIL_USERNAME: ${{ secrets.EMAIL_USERNAME }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: python -m app.main --daily

      - name: Commit updated database
        run: |
          git config user.name "degree-apprenticeship-tracker-bot"
          git config user.email "actions@users.noreply.github.com"
          git add tracker.db
          git diff --cached --quiet || git commit -m "Update tracker database [skip ci]"
          git push
